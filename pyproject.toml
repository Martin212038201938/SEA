[project]
name = "sea-cockpit"
version = "0.1.0"
description = "SEA-Cockpit der Copilotenschule: Google Ads und Microsoft Advertising auswerten, speichern, vergleichen und Verbesserungen vorschlagen."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "mcp>=2.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
google = ["google-ads>=27.0"]
microsoft = ["bingads>=13.0.22"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cockpit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
