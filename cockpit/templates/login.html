{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="card login">
  <h1>SEA-Cockpit</h1>
  <p class="sub">Copilotenschule · Google Ads und Microsoft Advertising</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
    <label>Benutzername</label><input name="username" autocomplete="username" autofocus>
    <label>Passwort</label><input name="password" type="password" autocomplete="current-password">
    <button class="btn" type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
