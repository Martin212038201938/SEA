name: Deploy auf Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy per SSH
        if: ${{ secrets.ALWAYSDATA_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ssh-y-b.alwaysdata.net
          username: y-b
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ~/sea-cockpit && bash scripts/alwaysdata_deploy.sh
      - name: Hinweis ohne Secret
        if: ${{ secrets.ALWAYSDATA_SSH_KEY == '' }}
        run: echo "Secret ALWAYSDATA_SSH_KEY fehlt – Deployment übersprungen. Manuell: ssh y-b@ssh-y-b.alwaysdata.net 'cd ~/sea-cockpit && bash scripts/alwaysdata_deploy.sh'"
