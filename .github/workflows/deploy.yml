name: Deploy auf Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY != '' }}
      HAS_API: ${{ secrets.ALWAYSDATA_API_KEY != '' }}
      ALWAYSDATA_SITE_ID: "1092854"
      ALWAYSDATA_ACCOUNT: "y-b"
    steps:
      - name: Code auf den Server bringen (SSH)
        if: env.HAS_KEY == 'true'
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ssh-y-b.alwaysdata.net
          username: y-b
          key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ~/sea-cockpit && bash scripts/alwaysdata_deploy.sh
      - name: Site neu starten (Alwaysdata-API)
        if: env.HAS_KEY == 'true' && env.HAS_API == 'true'
        env:
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
        run: |
          KEY=$(printf '%s' "$ALWAYSDATA_API_KEY" | tr -d '[:space:]')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST --basic --user "${KEY} account=${ALWAYSDATA_ACCOUNT}:" \
            "https://api.alwaysdata.com/v1/site/${ALWAYSDATA_SITE_ID}/restart/")
          echo "Alwaysdata-API Antwort: ${code}"
          case "$code" in 2*) ;; *) echo "Neustart fehlgeschlagen (Token prüfen: Alwaysdata → Tokens; Secret ohne Leerzeichen/Zeilenumbruch)"; exit 1;; esac
          sleep 30
          curl -fsS -o /dev/null -w "healthz: %{http_code}\n" "https://sea.copilotenschule.de/healthz"
      - name: Hinweis ohne API-Key
        if: env.HAS_KEY == 'true' && env.HAS_API != 'true'
        run: echo "Secret ALWAYSDATA_API_KEY fehlt. Code liegt auf dem Server, aber der laufende Prozess ist noch der alte. Im Alwaysdata-Panel die Site neu starten oder das Secret anlegen."
      - name: Hinweis ohne SSH-Secret
        if: env.HAS_KEY != 'true'
        run: |
          echo "Secret ALWAYSDATA_SSH_KEY fehlt, Deployment uebersprungen."
          echo "Manuell: ssh y-b@ssh-y-b.alwaysdata.net 'cd ~/sea-cockpit && bash scripts/alwaysdata_deploy.sh'"
